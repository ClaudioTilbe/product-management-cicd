services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${SQL_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    # NUEVO: healthcheck — la API espera a que SQL Server esté listo
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_PASSWORD}' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: ProductManagement.API/Dockerfile
    depends_on:
      sqlserver:
        # CAMBIO: espera al healthcheck, no solo al arranque del contenedor
        condition: service_healthy
    environment:
      # CAMBIO: Staging en lugar de Production
      ASPNETCORE_ENVIRONMENT: Staging
      # CAMBIO: una sola línea sin operador > para evitar newlines
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ProductManagement_StagingDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"

  ui:
    build:
      context: ./ProductManagement.UI
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"

volumes:
  sqldata: