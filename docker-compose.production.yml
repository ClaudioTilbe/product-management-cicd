version: "3.9"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-production

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SQL_PASSWORD}

    ports:
      - "1433:1433"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_PASSWORD}' -Q 'SELECT 1' -No"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  api:
    image: ghcr.io/${REPOSITORY_LC}/api:latest
    container_name: api-production

    restart: unless-stopped

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver;
        Database=ProductManagement;
        User Id=sa;
        Password=${SQL_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=False;

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  ui:
    image: ghcr.io/${REPOSITORY_LC}/ui:latest
    container_name: ui-production

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "80:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
